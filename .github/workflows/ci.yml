# CI: lint, types, tests, build, e2e, dependency audit and sensitive-data scan on every PR and
# push to main. Every value below is FICTITIOUS: CI never talks to Cloudflare, Resend or the
# operator's account, and the real values live only in the operator's .env (and, for the
# optional deploy workflow, in repository secrets). The templates' placeholders
# (web/wrangler.template.jsonc, workers/jobs/wrangler.template.jsonc) and the PUBLIC_* keys of
# web/src/env.ts are all covered here, so tools/render-wrangler.mjs and the build need no .env.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  WRANGLER_SEND_METRICS: 'false'
  # Cloudflare (fictitious; local Miniflare only)
  CLOUDFLARE_ACCOUNT_ID: '00000000000000000000000000000000'
  CLOUDFLARE_WORKERS_SUBDOMAIN: ci-fixture
  WORKER_NAME_WEB: open-auri-ci
  WORKER_NAME_JOBS: open-auri-ci-jobs
  D1_DATABASE_NAME: open-auri-ci
  D1_DATABASE_ID: 00000000-0000-4000-8000-000000000001
  D1_DATABASE_NAME_STAGING: open-auri-ci-staging
  D1_DATABASE_ID_STAGING: 00000000-0000-4000-8000-000000000002
  KV_CONFIG_ID: '00000000000000000000000000000001'
  KV_CONFIG_ID_STAGING: '00000000000000000000000000000002'
  R2_BUCKET: open-auri-ci-media
  R2_BUCKET_STAGING: open-auri-ci-media-staging
  ACCESS_LOG_QUEUE: open-auri-ci-access-log
  ACCESS_LOG_QUEUE_STAGING: open-auri-ci-access-log-staging
  ACCESS_LOG_DLQ: open-auri-ci-access-log-dlq
  ACCESS_LOG_DLQ_STAGING: open-auri-ci-access-log-dlq-staging
  # Public build values (fictitious; embedded in the CI bundle only)
  PUBLIC_ORIGIN: https://open-auri-ci.ci-fixture.workers.dev
  PUBLIC_GITHUB_URL: https://github.com/example/open-auri
  PUBLIC_ANDROID_APP_ID: com.openauri.app
  PUBLIC_ANDROID_CERT_SHA256: ''
  PUBLIC_LGPD_CONTROLLER: Controlador Ficticio de CI
  PUBLIC_LGPD_CONTACT_EMAIL: lgpd@example.com
  PUBLIC_LGPD_CNPJ: 00.000.000/0000-00
  PUBLIC_LGPD_ADDRESS: Endereco Ficticio, 0, Cidade Exemplo
  PUBLIC_LGPD_DPO_NAME: Encarregado Ficticio
  PUBLIC_POLICY_EFFECTIVE_DATE: '2026-01-01'
  # Cloudflare's documented always-pass Turnstile test keys
  PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
  TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
  # Runtime secrets (fictitious; only written to web/.dev.vars for the local e2e preview)
  BETTER_AUTH_SECRET: ci-fictitious-better-auth-secret-not-real-0000
  RESEND_API_KEY: ci-fictitious-resend-key
  IPHASH_PEPPER: ci-fictitious-iphash-pepper-not-real-0000
  ACCESS_LOG_KEY: ci-fictitious-access-log-key-not-real-0000
  RESEND_FROM: open-auri CI <ci@example.com>
  # Flags
  ACCESS_LOG_ENABLED: 'true'
  SIGNUP_ENABLED: 'false'
  ADMIN_2FA_REQUIRED: 'true'
  EMAIL_TRANSPORT: resend

jobs:
  changes:
    name: Android path filter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            android:
              - 'apps/android/**'
              - 'web/src/lib/cable/**'
              - 'web/src/lib/files/**'
              - 'src/dsp/**'
              - 'src/transport/**'
              - 'schemas/android-*'
              - 'test/fixtures/**'
              - 'docs/protocol-0xcb.md'
              - 'tools/run-gradle.mjs'
              - 'tools/android-*.mjs'
              - 'tools/verify-capacitor-config.mjs'
              - 'tools/usb-golden.mjs'
              - 'tools/play-assets.mjs'
              - 'test/tools/android-*.test.mjs'
              - 'test/tools/run-gradle.test.mjs'
              - 'test/tools/verify-capacitor-config.test.mjs'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

  static:
    name: Lint, types and scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Sensitive-data scan (generic shapes; no .env in CI)
        run: node tools/check-sensitive.mjs --no-env
      - name: Dependency audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: Root lint
        run: npm run lint
      - name: Root typecheck
        run: npm run typecheck
      - name: Paraglide compile (web)
        working-directory: web
        run: >-
          node --input-type=module -e "import { compile } from '@inlang/paraglide-js';
          import options from './project.inlang/paraglide.config.mjs';
          await compile({ project: './project.inlang', outdir: './src/lib/paraglide', ...options });"
      - name: Web svelte-kit sync
        working-directory: web
        run: npx svelte-kit sync
      - name: Web prettier
        working-directory: web
        run: npx prettier --check .
      - name: Web eslint
        working-directory: web
        run: npx eslint .
      - name: Web svelte-check (runs svelte-kit sync first)
        run: npm run -w web check
      - name: Web integration types
        run: npm run -w web check:int
      - name: Jobs types
        run: |
          npm run -w workers/jobs gen
          npm run -w workers/jobs check

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Core tests with coverage gates
        run: npm run test:coverage
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium (Vitest browser project)
        run: npx playwright install --with-deps chromium
      - name: Web unit and component tests
        run: npm run -w web test:coverage
      - name: Web integration tests
        run: npm run -w web test:int:coverage
      - name: Jobs tests
        run: npm run -w workers/jobs test

  build:
    name: Build and budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Web build (fictitious PUBLIC_* values)
        run: npm run -w web build
      - name: Bundle budgets
        run: npm run -w web budgets
      - name: Jobs build (dry run)
        run: npm run -w workers/jobs build

  e2e:
    name: E2E (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Render wrangler.jsonc and .dev.vars (fictitious values)
        run: |
          npm run -w web gen
          npm run -w web dev-vars
      - name: Playwright
        # No embedded AutoEq data in CI (generated locally, git-ignored); see tests/e2e/smoke.spec.ts.
        env:
          OA_NO_AUTOEQ: '1'
        run: npm run -w web test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  android-emulator:
    name: Android emulator
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    env:
      OA_NO_AUTOEQ: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0" "platform-tools"
      # Avoid setup-gradle's init script, which is not covered by dependency verification.
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/android/android/**/*.gradle', 'apps/android/android/gradle/**') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: npm ci
      - name: Render wrangler.jsonc and .dev.vars (fictitious values)
        run: |
          npm run -w web gen
          npm run -w web dev-vars
      - name: Build the real web preview (production CSP)
        run: npm run -w web build
      - name: Start preview on the emulator's host
        shell: bash
        timeout-minutes: 5
        run: |
          npm run -w web preview > "$RUNNER_TEMP/android-preview.log" 2>&1 &
          PREVIEW_PID=$!
          for attempt in {1..90}; do
            if curl --fail --silent --connect-timeout 1 --max-time 2 http://127.0.0.1:4173/ > /dev/null; then
              printf 'Android preview ready (attempt %s/90)\n' "$attempt"
              exit 0
            fi
            if ! kill -0 "$PREVIEW_PID" 2>/dev/null; then
              echo '::error::Android preview exited before becoming ready'
              cat "$RUNNER_TEMP/android-preview.log"
              exit 1
            fi
            sleep 2
          done
          echo '::error::Android preview was not ready after 90 bounded attempts'
          cat "$RUNNER_TEMP/android-preview.log"
          exit 1
      - name: Build Android for the local preview
        run: npm run build:android:e2e
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests against the real preview
        # HTTP is not a secure context: service workers and HTTPS DownloadBridge attachment
        # still need a separate HTTPS device run (Q2 m3).
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          # The wrapper syncs before testing; retain the e2e target instead of its prod default.
          script: npm run test:android:device -- --target e2e
      - name: Upload Android instrumented test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-emulator-reports
          path: |
            apps/android/android/app/build/reports/androidTests/
            apps/android/android/app/build/outputs/androidTest-results/
            ${{ runner.temp }}/android-preview.log
          retention-days: 7

  android:
    name: Android
    needs: changes
    # Job-level skips succeed for required checks on docs-only PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0" "platform-tools"
      # Plain cache instead of gradle/actions/setup-gradle: its init script resolves its own plugin
      # classpath, which dependency verification (gradle/verification-metadata.xml) rejects.
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/android/android/**/*.gradle', 'apps/android/android/gradle/**') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: npm ci
      - name: Tooling tests
        run: npm run test:tools
      - name: Android typecheck
        run: npm run typecheck:android
      - name: Android lint
        run: npm run lint:android
      - name: Android unit tests and coverage gates
        run: npm run test:android
      - name: Android debug build
        run: npm run build:android
      - name: Android release dry run (ephemeral signing)
        shell: bash
        run: |
          KEYSTORE="$RUNNER_TEMP/android-ci.jks"
          KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          export KEYSTORE_PASSWORD
          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEYSTORE_PASSWORD \
            -alias android-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=Android CI, O=Open Auri, C=BR" \
            -noprompt
          npm run build:android:release
          APKSIGNER="$ANDROID_HOME/build-tools/36.1.0/apksigner"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias android-ci \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out "$RUNNER_TEMP/android-release-signed.apk" \
            apps/android/android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --verbose --print-certs "$RUNNER_TEMP/android-release-signed.apk"
      - name: Delete ephemeral signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/android-ci.jks"
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: apps/android/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
      - name: Upload Android coverage, lint and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            apps/android/android/app/build/reports/kover/
            apps/android/android/app/build/reports/lint-results*
            apps/android/android/app/build/reports/tests/
            apps/android/android/app/build/test-results/
          retention-days: 7
