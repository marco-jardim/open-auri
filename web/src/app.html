<!doctype html>
<html lang="%lang%" dir="%dir%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Blocking and external on purpose (CSP script-src 'self'): avoids a locale flash. -->
		<script src="%sveltekit.assets%/lang-boot.js"></script>
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="theme-color" content="#171715" />
		<link rel="icon" href="%sveltekit.assets%/icons/icon.svg" type="image/svg+xml" />
		<!-- W6 (spec §5.6): the three global faces above the fold on every route, at most three. -->
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/geist/geist-latin-wght-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/instrument-serif/instrument-serif-latin-400-italic.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/instrument-serif/instrument-serif-latin-400-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		%analytics%
	</body>
</html>
